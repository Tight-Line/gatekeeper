name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  # Change these to your DockerHub username/org
  GATEKEEPERD_IMAGE: ${{ toLower(vars.DOCKERHUB_USERNAME) }}/gatekeeperd
  RELAY_IMAGE: ${{ toLower(vars.DOCKERHUB_USERNAME) }}/gatekeeper-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for gatekeeperd
        id: meta-gatekeeperd
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEKEEPERD_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Extract metadata for gatekeeper-relay
        id: meta-relay
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RELAY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push gatekeeperd
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-gatekeeperd.outputs.tags }}
          labels: ${{ steps.meta-gatekeeperd.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gatekeeper-relay
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.relay
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-relay.outputs.tags }}
          labels: ${{ steps.meta-relay.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
