# gatekeeper-relay configuration example
#
# This file configures the relay client that runs inside a private network.
# It connects outbound to the gatekeeper server and polls for webhooks to
# deliver locally.
#
# Environment variables are supported using ${VAR_NAME} syntax.

# The gatekeeper server to connect to
server: "https://webhooks.example.com"

# Channels to poll for webhooks
# Each channel has:
#   - name: A descriptive name for logging
#   - token: The relay token (must match route config on server)
#   - destination: Local URL to forward received webhooks to
channels:
  - name: slack-webhooks
    token: "${RELAY_TOKEN_SLACK}"
    destination: "http://localhost:8080/webhooks/slack"

  - name: github-webhooks
    token: "${RELAY_TOKEN_GITHUB}"
    destination: "http://localhost:8080/webhooks/github"

  # preserve_path controls whether the original webhook path is appended to
  # the destination URL. Default is true. Set to false when the destination
  # URL already contains the full path and path-appending would break routing.
  # - name: google-chat
  #   token: "${RELAY_TOKEN_GCHAT}"
  #   destination: "http://my-service.namespace.svc.cluster.local:8080"
  #   preserve_path: false
