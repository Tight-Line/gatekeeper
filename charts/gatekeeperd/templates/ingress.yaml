{{- if .Values.ingress.enabled }}
{{- $fullName := include "gatekeeperd.fullname" . -}}
{{- $hosts := list -}}
{{- range .Values.routes }}
{{- if not (has .hostname $hosts) }}
{{- $hosts = append $hosts .hostname }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "gatekeeperd.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- if .Values.ingress.tls.secretName }}
    {{- /* Single secret for all hosts */ -}}
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
    {{- else }}
    {{- /* Auto-generated secret per host */ -}}
    {{- range $hosts }}
    - hosts:
        - {{ . | quote }}
      secretName: {{ . | replace "." "-" }}-tls
    {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
    {{- end }}
{{- end }}
