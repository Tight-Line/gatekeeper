{{- if .Values.gateway.enabled }}
{{- $fullName := include "gatekeeperd.fullname" . -}}
{{- $hosts := list -}}
{{- range .Values.routes }}
{{- if not (has .hostname $hosts) }}
{{- $hosts = append $hosts .hostname }}
{{- end }}
{{- end }}
{{- range $host := $hosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-{{ $host | replace "." "-" }}
  labels:
    {{- include "gatekeeperd.labels" $ | nindent 4 }}
  {{- with $.Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.gatewayName }}
      namespace: {{ $.Values.gateway.gatewayNamespace }}
      {{- if $.Values.gateway.sectionName }}
      sectionName: {{ $.Values.gateway.sectionName }}
      {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}
          port: 80
{{- end }}
{{- end }}
