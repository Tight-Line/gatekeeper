apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gatekeeperd.fullname" . }}-config
  labels:
    {{- include "gatekeeperd.labels" . | nindent 4 }}
data:
  config.yaml: |
    global:
      acme_email: {{ .Values.tls.acmeEmail | quote }}
      acme_cache_dir: {{ .Values.tls.cacheDir | quote }}
      metrics_port: {{ .Values.metrics.port }}
      log_level: {{ .Values.logging.level }}
      {{- if .Values.defaultRateLimiter }}
      default_rate_limiter: {{ .Values.defaultRateLimiter | quote }}
      {{- end }}

    ip_allowlists:
      {{- range $name, $allowlist := .Values.ipAllowlists }}
      {{ $name }}:
        {{- if $allowlist.cidrs }}
        cidrs:
          {{- range $allowlist.cidrs }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- if $allowlist.fetchUrl }}
        fetch_url: {{ $allowlist.fetchUrl | quote }}
        fetch_jq: {{ $allowlist.fetchJq | quote }}
        refresh_interval: {{ $allowlist.refreshInterval }}
        {{- end }}
      {{- end }}

    verifiers:
      {{- range $name, $verifier := .Values.verifiers }}
      {{ $name }}:
        type: {{ $verifier.type }}
        {{- if eq $verifier.type "slack" }}
        signing_secret: ${{ "{" }}{{ $verifier.signingSecretKey }}{{ "}" }}
        {{- if $verifier.maxTimestampAge }}
        max_timestamp_age: {{ $verifier.maxTimestampAge }}
        {{- end }}
        {{- else if eq $verifier.type "gitlab" }}
        token: ${{ "{" }}{{ $verifier.tokenKey }}{{ "}" }}
        {{- else if eq $verifier.type "github" }}
        secret: ${{ "{" }}{{ $verifier.secretKey }}{{ "}" }}
        {{- else if eq $verifier.type "shopify" }}
        secret: ${{ "{" }}{{ $verifier.secretKey }}{{ "}" }}
        {{- else if eq $verifier.type "api_key" }}
        header: {{ $verifier.header | quote }}
        token: ${{ "{" }}{{ $verifier.tokenKey }}{{ "}" }}
        {{- else if eq $verifier.type "hmac" }}
        header: {{ $verifier.header | quote }}
        secret: ${{ "{" }}{{ $verifier.secretKey }}{{ "}" }}
        hash: {{ $verifier.hash | quote }}
        encoding: {{ $verifier.encoding | quote }}
        {{- else if eq $verifier.type "json_field" }}
        path: {{ $verifier.path | quote }}
        token: ${{ "{" }}{{ $verifier.tokenKey }}{{ "}" }}
        {{- else if eq $verifier.type "query_param" }}
        name: {{ $verifier.name | quote }}
        token: ${{ "{" }}{{ $verifier.tokenKey }}{{ "}" }}
        {{- else if eq $verifier.type "header_query_param" }}
        header: {{ $verifier.header | quote }}
        name: {{ $verifier.name | quote }}
        token: ${{ "{" }}{{ $verifier.tokenKey }}{{ "}" }}
        {{- else if eq $verifier.type "oidc" }}
        issuer: {{ $verifier.issuer | quote }}
        audience: {{ $verifier.audience | quote }}
        {{- if $verifier.jwksUri }}
        jwks_uri: {{ $verifier.jwksUri | quote }}
        {{- end }}
        {{- if $verifier.claims }}
        claims:
          {{- range $k, $v := $verifier.claims }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}

    {{- if .Values.rateLimiters }}
    rate_limiters:
      {{- range $name, $limiter := .Values.rateLimiters }}
      {{ $name }}:
        total_rps: {{ $limiter.totalRps }}
        per_ip_rps: {{ $limiter.perIpRps | default 0 }}
        burst: {{ $limiter.burst }}
        {{- if $limiter.cleanupInterval }}
        cleanup_interval: {{ $limiter.cleanupInterval }}
        {{- end }}
        {{- if $limiter.idleTimeout }}
        idle_timeout: {{ $limiter.idleTimeout }}
        {{- end }}
      {{- end }}
    {{- end }}

    routes:
      {{- range .Values.routes }}
      - hostname: {{ .hostname | quote }}
        path: {{ .path | quote }}
        {{- if .ipAllowlist }}
        ip_allowlist: {{ .ipAllowlist | quote }}
        {{- end }}
        {{- if .verifier }}
        verifier: {{ .verifier | quote }}
        {{- end }}
        {{- if .rateLimiter }}
        rate_limiter: {{ .rateLimiter | quote }}
        {{- end }}
        {{- if .destination }}
        destination: {{ .destination | quote }}
        {{- else if .relayTokenKey }}
        relay_token: ${{ "{" }}{{ .relayTokenKey }}{{ "}" }}
        {{- end }}
      {{- end }}
